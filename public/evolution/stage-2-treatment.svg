<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="treatAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07131C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="toothBodyTreat" x1="220" y1="170" x2="580" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="100" y1="360" x2="700" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="320" y1="300" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="treatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="400" cy="400" r="370" fill="url(#treatAura)"/>

  <!-- High-Precision Dental CAD Mesh & Align Rings -->
  <circle cx="400" cy="400" r="330" stroke="#22D3EE" stroke-width="2" stroke-dasharray="16 16" opacity="0.45"/>
  <circle cx="400" cy="400" r="240" stroke="#38BDF8" stroke-width="1.5" opacity="0.35"/>
  <circle cx="400" cy="400" r="140" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- 3D Tooth Under Active Precision Treatment -->
  <g filter="url(#treatGlow)">
    <!-- Root Structure -->
    <path d="M290 450 C 275 540, 305 660, 340 670 C 375 650, 370 550, 385 460 Z" fill="#64748B" opacity="0.75"/>
    <path d="M415 460 C 430 550, 425 650, 460 670 C 495 660, 525 540, 510 450 Z" fill="#475569" opacity="0.75"/>

    <!-- Recontoured Crown Body -->
    <path d="M265 240 C 280 180, 340 170, 400 205 C 460 170, 520 180, 535 240 C 560 330, 570 420, 535 530 C 495 605, 450 550, 410 460 C 390 460, 350 550, 305 605 C 270 530, 240 330, 265 240 Z" 
          fill="url(#toothBodyTreat)" stroke="#38BDF8" stroke-width="3"/>

    <!-- Gloss Cusp Highlights -->
    <path d="M285 230 C 300 195, 345 190, 385 220 C 355 240, 305 255, 285 230 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M415 220 C 455 190, 500 195, 515 230 C 495 255, 445 240, 415 220 Z" fill="#FFFFFF" opacity="0.75"/>

    <!-- Restorative Bonding Area (Cured Enamel Matrix) -->
    <ellipse cx="440" cy="285" rx="30" ry="20" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
    <path d="M425 285 L 455 285 M 440 270 L 440 300" stroke="#0284C7" stroke-width="2"/>

    <!-- 3D Orthodontic Bracket / Aligner Hub -->
    <rect x="340" y="320" width="120" height="90" rx="16" fill="url(#bracketGrad)" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <rect x="360" y="340" width="80" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="400" cy="365" r="8" fill="#22D3EE"/>

    <!-- Orthodontic Archwire -->
    <path d="M160 365 C 260 350, 540 350, 640 365" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 365 C 260 350, 540 350, 640 365" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>

    <!-- Laser Scanning Beam (Horizontal Active Sweep) -->
    <line x1="80" y1="285" x2="720" y2="285" stroke="url(#laserBeam)" stroke-width="3"/>
    <circle cx="440" cy="285" r="12" fill="#22D3EE" opacity="0.6"/>
  </g>

  <!-- Realtime Alignment Vector HUD -->
  <path d="M 230 400 L 310 400 M 300 390 L 315 400 L 300 410" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="160" fill="#22D3EE" font-size="14" font-family="monospace" font-weight="bold" letter-spacing="3">
    [●] CAD/CAM GUIDED ALIGNMENT IN PROGRESS
  </text>
  <text x="180" y="650" fill="#38BDF8" font-size="13" font-family="monospace" font-weight="bold" letter-spacing="2">
    TOLERANCE: ±0.02mm | CERAMIC BOND: 99.8%
  </text>
</svg>
